<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body{
            background-color: rgb(37, 180, 246);
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div>
            Digite sua idade: <input type="number" name="number" id="txtidade">
            <button onclick="verificar()">Verificar</button>
        </div>
        <div>
          <h2 id="res">O resultado vai aparecer aqui...</h2>
        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script>
        function verificar(){
            let idade = Number(document.getElementById('txtidade').value)
            let res = document.getElementById('res')
            if(idade >= 18 ){
                res.innerText ='Você é maior de idade!'
            }else{
                res.innerText = 'Você é menor de idade!'
            }
        }
    </script>
</body>
</html>
