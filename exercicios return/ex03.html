<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de idade</title>
    <style>
        body{
            background-color: rgb(37, 180, 246);
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Calculador de idade</h1>
    </header>

    <section>
        <div>
            <input type="number" name="number" id="txtano" placeholder="Ex: 1999"><br><br>
            <button onclick="processaridade()">Calcular Idade</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
   <script>
      function calcularIdade(anodenascimento){
        let idade = 2026 - anodenascimento
        return idade
      }

      function processaridade(){
        let ano = Number(document.getElementById('txtano').value)
        let resultado = document.getElementById('res')

        let nasceu = calcularIdade(ano)
      
        resultado.innerText = `Você tem ${nasceu} anos `
      
      }
   </script>
    
</body>
</html>
