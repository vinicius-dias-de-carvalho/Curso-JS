<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Triplo</title>
    <style>
        body{
            background-color: rgb(37, 180, 246);
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Calculador de Triplo</h1>
    </header>

    <section>
        <div>
            <input type="number" name="number" id="txtnum" placeholder="Ex: 9"><br><br>
            
            <button onclick="processartriplo()">Calcular Triplo</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script>
        function calculartriplo(numero){
            let calcular = numero * 3

            return calcular
        }

        function processartriplo(){
            let n = Number(document.getElementById('txtnum').value)
            let resultado =  document.getElementById('res')

            let valorfinal = calculartriplo(n)

            resultado.innerText = `O triplo de ${n} é ${valorfinal}`
        }
    </script>
    
</body>
</html>
