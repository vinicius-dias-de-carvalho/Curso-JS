<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compre peças de pc de qualidade aqui</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            outline:none;
           box-sizing: border-box;
        }

        body{
            display: flex;
            flex-direction: column;
            background : linear-gradient(to right, rgb(20, 16, 36), rgb(153, 149, 77));
            width: auto;
            align-items: center;

        }

       header{
        display: flex;
        flex-direction:  column;
        margin: 10px;
        
       }
        #campo-busca{
        margin: 30px;
         max-width: 250px;
         width: 100%;
         background-color:  lightgray;
         padding: 8px;
         border: 3px solid black;
         border-radius: 10px;
         
        }
       #resultado{
        display: grid;
        max-width: 1000px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        
       
        
      }

      .card-produto{
        display: flex;
        flex-direction: column;
        background-color: rgb(199, 201, 107);
        padding: 20px;
        border-radius: 5px;
        box-shadow: 3px 2px 10px rgb(0, 0, 0.2);
        gap: 5px;
         transition: transform 0.3s, box-shadow 0.3s;
      }
      .card-produto:hover{
       transform: translateY(-10px);
       box-shadow: 0 15px 25px rgb(0, 0, 0.3);
      }
    </style>
</head>
<body>
   <header><h1>Loja do hades!</h1>
     </header> 
    <div>
    <input type="text" name="campo-busca" id="campo-busca" placeholder="Buscar produto">
      </div>

      <div id="resultado">

      </div>
</body>
   
<script>
  let produtos = [
    {nome: 'intel core i7 14700K', categoria: "Processador", id: 12, preco: 2500},
    {nome: 'RTX 5070 TI 16gb', categoria: "Placadevideo", id: 25, preco: 4800},
    {nome: 'Radeon 9070 XT 16gb', categoria: "Placadevideo", id: 22, preco: 4650},
    {nome: 'Ryzen 9 9600X3D', categoria: "Processador", id: 28, preco: 3400},
    {nome: 'Memória RAM 16GB DDR5 5600MHz', categoria: "Memoria", id: 30, preco: 450},
    {nome: 'SSD NVMe M.2 1TB Kingston', categoria: "Armazenamento", id: 31, preco: 500},
    {nome: 'Placa-Mãe ASUS TUF Gaming B550M', categoria: "Placamae", id: 32, preco: 950},
    {nome: 'Fonte Corsair 650W 80 Plus Bronze', categoria: "Fonte", id: 33, preco: 420},
    {nome: 'Gabinete Gamer Vidro Temperado RGB', categoria: "Gabinete", id: 34, preco: 350},
    {nome: 'Monitor Gamer 24 Pol 165Hz IPS', categoria: "Monitor", id: 35, preco: 1200},
    {nome: 'Teclado Mecânico Gamer Switch Red', categoria: "Periferico", id: 36, preco: 250},
    {nome: 'Mouse Gamer Logitech G203 RGB', categoria: "Periferico", id: 37, preco: 160}
  ]

    function gerarcard(lista){
        let gerar = lista.map(({nome, categoria, preco})=>`
        <div class="card-produto">
        <h3>${nome}</h3>
        <p>${categoria}</p>
        <span >${preco}</span>    
            </div>`
    ).join('')

    return gerar
    }

    document.getElementById('resultado').innerHTML = gerarcard(produtos)

     let campobusca = document.getElementById('campo-busca')

      campobusca.addEventListener('input', () =>{
        let textodigitado = campobusca.value.toLowerCase()

        let resultadofinal = produtos.filter(({nome, categoria,})=> nome.toLowerCase().includes(textodigitado) || categoria.toLowerCase().includes(textodigitado))

        document.getElementById('resultado').innerHTML = gerarcard(resultadofinal)
      })
</script>
</html>
