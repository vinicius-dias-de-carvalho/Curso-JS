<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <style>
        body{
            background-color: rgb(37, 180, 246);
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Contador de decolagem</h1>
    </header>

    <section>
        <div>
            <input type="number" name="number" id="txtd">
            <button onclick="contagem()">Contagem</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
     <script>
        function contagem(){
            let txtd = document.getElementById('txtd')
            let res = document.getElementById('res')

            if(txtd.value.length === 0){
                alert ('[ERRO] Preencha os Campos.')

            }else{
               let d = Number(txtd.value)

               res.innerText = ''

               for(let c = d; c >= 0 ; c--){
                res.innerText += `${c} -`


               }
               res.innerText += 'Decolar'
            }
        }
     </script>
    
</body>
</html>
