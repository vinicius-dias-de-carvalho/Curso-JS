<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <style>
        body{
            background-color: black;
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Título</h1>
    </header>

    <section>
        <div>
            <input type="number" name="number" id="txtid">
            <button onclick="calcular()">Calcular idade</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
      <script>
        function calcular(){
          let idade = Number(document.getElementById('txtid').value)
          let resultado = document.getElementById('res')

          if(idade >= 16){
            resultado.style.color = 'green'
            resultado.innerText = `Acesso Liberado! Bom jogo`

          }else if(idade < 16){
            resultado.style.color = 'red'
            resultado.innerText = `Acesso Negado!
            Idade minima:16 anos`
          }

        }
      </script>
    
</body>
</html>
