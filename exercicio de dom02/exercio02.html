<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #121212;
            color: white;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 180px;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007acc;
            color: white;
            margin-left: 5px;
        }
        #resultado {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
    </style>
</head>
<body>
    <header> 
             
        <h2>Digite a sua idade:</h2>
    </header>

    <section>
        <div>
             
             <input type="number" name="number" id="txtidade">
            <button onclick="verificar()">Verificar</button>
        </div>
        <div id="resultado"> O resultado vai aparecer aqui...

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>

    <script>
        function verificar(){
            let idade = Number(document.getElementById('txtidade').value)
            let resultado = document.getElementById('resultado')
           
            if(idade <= 0){
           
            resultado.innerText = 'digite a idade correta'
            resultado.style.color = 'yellow'
             
            }else if(idade >= 18){
                 resultado.innerText = 'Você não é menor de idade'
                 resultado.style.color = 'green'
            }else{
             resultado.innerText = 'Menor de idade'
             resultado.style.color = 'red'

            }
        }
        
    </script>
</body>
</html>
