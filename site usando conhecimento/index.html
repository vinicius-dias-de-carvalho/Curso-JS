<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Produtos - Portfólio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .carrinho-box { background-color: #3b82f6; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        
        .controles { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #1e293b; color: #fff; flex: 1; min-width: 200px; }
        
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; color: #38bdf8; }
        .card .preco { font-size: 1.2rem; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .card button { background-color: #3b82f6; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .card button:hover { background-color: #2563eb; }
     .filtroproduto button{
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        margin-right: 8px;
        border-radius: 6px;
        cursor: pointer;
         margin-bottom: 12px;
     }

     .filtroproduto button:hover{
        background-color: #2d67c5;
        transition: 0.2s;
     }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ TechStore Dashboard</h1>
            <div class="carrinho-box" >
                🛒 Itens no Carrinho: <span id="contador-carrinho">0</span><br><br>
                <p>valor: <span id="total-carrinho"></span></p>
            </div>
        </header>

        <section class="controles">
            <!-- Input de Busca -->
            <input type="text" id="input-busca" placeholder="Buscar produto pelo nome...">
            
            <!-- Select de Categoria -->
            <select id="select-categoria">
               
            </select>
        </section>
         <div class="filtroproduto">
                <button id="filtro1" onclick="filtrarprodutos('Todos')">Todos</button>
                <button  onclick="filtrarprodutos('Processador')">Processadores</button>
               <button onclick="filtrarprodutos('Placadevideo')">Placas de Vídeo</button>
         </div>
        <!-- Onde os produtos vão aparecer na tela -->
        <main class="grid-produtos" id="grid-produtos">
            
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
