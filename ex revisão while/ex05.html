<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <style>
        body{
            background-color: rgb(37, 180, 246);
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
       <h1>Tabuada interativa</h1>
    </header>

    <section>
        <div>
            <input type="number" name="number" id="num">
            <button onclick="tabuada()">Tabuada</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
   <script>
    function tabuada(){
        let num = document.getElementById('num')
        let res = document.getElementById('res')
        
        

        if(num.value.length === 0){
              alert ('[ERRO] digite um numero!')
        }else{
             let numero = Number(num.value)
            let c = 1
            
                while(c <= 10){   
                    let r = numero * c               
                    res.innerText += `${numero} x ${c} = ${r} \n`
                    c++

                }
        }
    }
   </script>
    
</body>
</html>
