<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Vitrine de Suplementos</title>
<style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        /* Estilo da caixa que segura os cards */
        #res {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        /* Estilo dos cards de produtos */
        .card-produto {
            border: 2px solid #2ea44f;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-produto h3 {
            margin-top: 0;
            color: #333;
        }

        .card-produto p {
            margin: 5px 0;
            color: #555;
        }

        /* Estilo do botão de carregar */
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #24823d;
        }
    </style>
</head>
<body>
    <header>
       <h1>Suplementos da Academia</h1>
    </header>

    <section>
        <div>
            <button onclick="mostrarsuplementos()">Carregar Produtos</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
     <script>
        function gerarcardsuplementos(lista){
            let suplementos = lista.filter(({disponivel}) => disponivel === true).map(({nome, preco}) => `<div class='card-produto'>
                <h3>${nome}</h3> 
                <p>Preço normal: R$ ${preco}</p>
                <p>Com desconto aluno: R$ ${preco - 20}</p>
                </div>`).join('')

            return suplementos    
        }

        function mostrarsuplementos(){
            let produtos = [
        { nome: "Whey Protein", preco: 120, disponivel: true },
        { nome: "Creatina", preco: 90, disponivel: true },
        { nome: "BCAA", preco: 60, disponivel: false },
        { nome: "Pré-Treino", preco: 110, disponivel: true }
        ]

        let resultadofinal = gerarcardsuplementos(produtos)

          document.getElementById('res').innerHTML = resultadofinal
        }
     </script>
    
</body>
</html>
