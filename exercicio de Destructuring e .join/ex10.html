<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Cursos Online</title>
    <style>
         body{
            display:flex;
            flex-flow:  column rap;
            background-color: gray;
            text-align: center;
        }
    

        .card-produto {
            border: 2px solid #2ea44f;
            padding: 15px;
            
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 220px;
        }

    </style>
</head>
<body>
    <header>
       <h1>Cursos com Inscrições Abertas</h1>
    </header>

    <section>
        <div>
            <button onclick="mostrarcurso()">Ver Cursos</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
       <script>
        function gerarcardscursos(lista){
            let cursos = lista.filter(({aberto})=> aberto === true).map(({nome, horas})=> `<div class="card-produto">
                <h3>${nome}</h3> 
                <p>Carga horária: ${horas} </p>
                </div>`).join ('')

            return cursos
        }

        function mostrarcurso(){
        let cursos = [
        { nome: "JavaScript Moderno", horas: 40, aberto: true },
        { nome: "React para Iniciantes", horas: 30, aberto: false },
        { nome: "Node.js e Express", horas: 50, aberto: true },
        { nome: "CSS Grid e Flexbox", horas: 20, aberto: true }
        ]

        let resultadofinal = gerarcardscursos(cursos)

        document.getElementById('res').innerHTML = resultadofinal
        }
       </script>
    
</body>
</html>
