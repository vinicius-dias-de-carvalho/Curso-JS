<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Hardware Shop</title>
    <style>
         body{
            display:flex;
            flex-flow: column;
            background-color: gray;
            text-align: center;
        }
    

        .card-produto {
            border: 2px solid #2ea44f;
            padding: 15px;
            
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 220px;
        }

    </style>
</head>
<body>
    <header>
       <h1>Peças em Destaque</h1>
    </header>

    <section>
        <div>
            <button onclick="mostrarhardware()">Carregar Hadware</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script>
        function gerarcardhardware(lista){
            let hardware = lista.filter(({emEstoque}) => emEstoque === true).map(({nome, preco}) => `<div class="card-produto">
                <h3>${nome}</h3>
                <p>À vista no Pix: R$ ${preco * 0.9}</p></div>`).join('')

            return hardware
        }

        function mostrarhardware(){
        let peças = [
        { nome: "Placa de Vídeo Arc B580", preco: 1800, emEstoque: true },
        { nome: "Processador Intel i5", preco: 1100, emEstoque: false },
        { nome: "Memória RAM 16GB", preco: 350, emEstoque: true },
        { nome: "SSD NVMe 1TB", preco: 400, emEstoque: true }
     ]

     let resultadofinal = gerarcardhardware(peças)

     document.getElementById('res').innerHTML = resultadofinal
        }
    </script>
    
</body>
</html>
