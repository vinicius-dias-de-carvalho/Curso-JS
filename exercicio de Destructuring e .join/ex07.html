<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício- Loja de Eletrônicos</title>
    <style>
 body{
            display:flex;
            flex-flow: column;
            background-color: gray;
            text-align: center;
        }
    

        .card-produto {
            border: 2px solid #2ea44f;
            padding: 15px;
            
           
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 220px;
        }

    </style>
</head>
<body>
    <header>
       <h1>Produtos em Destaque</h1>
    </header>

    <section>
        <div>
            <button onclick="mostrareletronicos()">Careegar Ofertas</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
     <script>
        function gerarcardeletronicos(lista){
            let eletronicos = lista.filter(({emEstoque})=> emEstoque === true).map(({nome,preco})=> `<div class="card-produto">
            <h3>${nome}</h3>
            <p>Preço: R$ ${preco}</p></div>` 
            ).join('')
            return eletronicos
        }

    function mostrareletronicos(){
       let eletronicos = [
        { nome: "Teclado Mecânico", preco: 300, emEstoque: true },
        { nome: "Mouse Gamer", preco: 150, emEstoque: false },
        { nome: "Monitor 144Hz", preco: 900, emEstoque: true },
        { nome: "Headset USB", preco: 210, emEstoque: true }
    ] 

    let resultadofinal = gerarcardeletronicos(eletronicos)

     document.getElementById('res').innerHTML = resultadofinal
        }
     </script>
    
</body>
</html>
