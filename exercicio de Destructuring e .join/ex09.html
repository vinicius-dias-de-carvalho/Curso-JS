<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Serviços Freelance</title>
    <style>
         body{
            display:flex;
            flex-flow: column;
            background-color: gray;
            text-align: center;
        }
    

        .card-produto {
            border: 2px solid #2ea44f;
            padding: 15px;
            
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 220px;
        }

    </style>
</head>
<body>
    <header>
       <h1>Projetos Web Disponíveis</h1>
    </header>

    <section>
        <div>
            <button onclick="mostrarprojeto()">Ver Projeto Web</button>
        </div>
        <div id="res">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script>
        function gerarcardsweb(lista){
            let card = lista.filter(({categoria})=> categoria === "Web").map(({titulo, valor}) =>
            `<div class="card-produto">
                <h3>${titulo}</h3>
                <p>Valor do Projeto: ${valor}</p>
                </div>` 
            ).join ('')

            return card
        }

        function mostrarprojeto(){
        let servicos = [
        { titulo: "Criação de Loja WooCommerce", categoria: "Web", valor: 2500 },
        { titulo: "Automação de Bot em Python", categoria: "Script", valor: 800 },
        { titulo: "Desenvolvimento de Landing Page", categoria: "Web", valor: 1200 },
        { titulo: "Configuração de Servidor Linux", categoria: "DevOps", valor: 1500 }
         ]

         let resultadofinal = gerarcardsweb(servicos)

         document.getElementById('res').innerHTML = resultadofinal
        }
    </script>
    
</body>
</html>
