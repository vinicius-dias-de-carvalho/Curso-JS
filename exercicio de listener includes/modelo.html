<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }

        #busca-curso {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #28a745;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        #res-cursos {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-curso {
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            width: 240px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-curso h3 {
            margin-top: 0;
            color: #212529;
        }

        .nivel {
            display: inline-block;
            background-color: #e2e3e5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #383d41;
        }
    </style>
</head>
<body>
    
</body>
</html>
