<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }

        #busca-peca {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #007bff;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: #1e1e1e;
            color: #fff;
        }

        #res-pecas {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-peca {
            border: 1px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            background-color: #1e1e1e;
        }

        .card-peca h3 {
            margin-top: 0;
            color: #007bff;
        }
        </style>
</head>
<body>
    <input type="text"  id="busca-peca" placeholder="Buscar componente...">

    <div id="res-pecas">

    </div>
</body>

<script>
    let estoque = [
      { componente: "Placa de Vídeo Arc B580 12GB",   categoria: "GPU" },
      { componente: "Processador Intel i5 13400F", categoria: "CPU" },
      { componente: "Memória RAM 16GB DDR5", categoria: "RAM" },
      { componente: "SSD NVMe 1TB PCIe 4.0", categoria: "Armazenamento" },
      { componente: "Fonte 650W 80 Plus Bronze", categoria: "Energia" }
    ]    


   function gerarcard(lista){
    let card = lista.map(({componente, categoria})=> `<div  class="card-peca">
        <h3>${componente}</h3>
        <p>tipo de componente:${categoria}</p></div>`).join('')

        return card
   }

    document.getElementById('res-pecas').innerHTML = gerarcard(estoque)

    let resultadofinal = document.getElementById('busca-peca')

    resultadofinal.addEventListener('input', () => {    let textodigitado = resultadofinal.value.toLowerCase()
        let produtosfiltrados = estoque.filter(({componente}) => componente.toLowerCase().includes(textodigitado))

        document.getElementById('res-pecas').innerHTML = gerarcard(produtosfiltrados)
    })


</script>
</html>
