<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Busca em Tempo Real - Hardware<</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        /* Estilo do campo de busca */
        #busca {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #007bff;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        #res {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-produto {
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-produto h3 {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>
    <h1> Buscar peças de PC</h1>

    <div>
        <input type="text" name="busca" id="busca" placeholder="Digite para buscar uma peça..">
       
    </div>
     <div id="res">

        </div>

        
</body>

<script>
    let produtos = [
      { nome: "Placa de Vídeo Arc B580", preco: 1800 },
      { nome: "Processador Intel i5", preco: 1100 },
      { nome: "Memória RAM 16GB", preco: 350  },
      { nome: "SSD NVMe 1TB", preco: 400 },
      { nome: "Fonte 650W", preco: 450 }
]
    function gerarcardlista(lista){
       let card = lista.map(({nome,preco})=> `<div class="card-produto">
        <h3>${nome}</h3>
        <p>valor do produto: R$ ${preco}</p></div>`).join('')

        return card
    }
     
     document.getElementById('res').innerHTML = gerarcardlista(produtos)

    let campobusca = document.getElementById('busca')
     
    campobusca.addEventListener('input', () => {
      
       let textodigitado = campobusca.value.toLowerCase()

        let produtosfiltrados = produtos.filter(({nome})=> nome.toLowerCase().includes(textodigitado))
    
       document.getElementById('res').innerHTML = gerarcardlista(produtosfiltrados)
    })
</script>
</html>
