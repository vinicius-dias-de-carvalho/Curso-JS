<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Treino - Ordenação Alfabética</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121214; color: #e1e1e6; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-bottom: 20px; color: #00875f; }
    .botoes-container { display: flex; gap: 12px; margin-bottom: 30px; }
    button { background-color: #202024; color: #fff; border: 1px solid #29292e; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    button:hover { border-color: #00875f; background-color: #29292e; }
    #grid-setup { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card-item { background-color: #202024; border: 1px solid #29292e; border-radius: 8px; padding: 20px; }
    .card-item h3 { font-size: 18px; margin-bottom: 8px; color: #fff; }
    .card-item p { font-size: 14px; color: #a8a8b3; margin-bottom: 8px; }
    .preco { color: #00875f; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🔤 Ordenar Peças por Nome</h1>

  <!-- 1. Botões chamando a nova ordenação -->
  <div class="botoes-container">
    <button onclick="ordemNome('az')">Ordem A-Z</button>
    <button onclick="ordemNome('za')">Ordem Z-A</button>
  </div>

  <div id="grid-setup"></div>
</body>


  <script>
    let pecas = [
      { nome: "Ryzen 5 5600", categoria: "Processador", preco: 850 },
      { nome: "Intel Arc B580", categoria: "Placa de Vídeo", preco: 1800 },
      { nome: "RTX 4060 8gb", categoria: "Placa de Vídeo", preco: 2100 },
      { nome: "Ryzen 7 5700X3D", categoria: "Processador", preco: 1400 },
      { nome: "Teclado Mecânico", categoria: "Periféricos", preco: 250 },
      { nome: "Mouse Gamer", categoria: "Periféricos", preco: 180 }
    ]
   
   function gerarcard(lista){
     let card = lista.map(({nome,categoria, preco})=>`<div class="card-item">
        <h3>${nome}</h3>
        <p>Categoria: ${categoria}</p>
        <span class='preco'>Preço: R$ ${preco}</span>
        </div>`).join('')
        
        return card
   }

   document.getElementById('grid-setup').innerHTML = gerarcard(pecas)

     function ordemNome(tipo){
         let listacopia = [...pecas]
        if(tipo === 'az'){
         listacopia.sort((a,b)=> a.nome.localeCompare(b.nome))
           
        }else{
         listacopia.sort((a, b)=>  b.nome.localeCompare(a.nome))
        }
         document.getElementById('grid-setup').innerHTML = gerarcard(listacopia)
     }

    </script>

    
    </html>
